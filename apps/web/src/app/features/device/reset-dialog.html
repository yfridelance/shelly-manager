<div class="backdrop" (click)="close()"></div>
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title">
  <h2 id="reset-title">{{ 'reset.title' | t: { device: device().name ?? formatMac(device().mac) } }}</h2>

  <div class="warning">
    <p [innerHTML]="'reset.warning' | t | emphasis"></p>
    <p [innerHTML]="'reset.apMode' | t | emphasis"></p>
  </div>
  <p class="muted">{{ 'reset.snapshotHint' | t }}</p>

  <form (submit)="submit($event)">
    <label class="field">
      <span>
        {{ 'reset.confirmMac' | t }} <code>{{ formatMac(device().mac) }}</code>
        @if (device().name) {
          {{ 'reset.confirmOrName' | t }} <code>{{ device().name }}</code>
        }
        {{ 'reset.confirmType' | t }}
      </span>
      <input #confirmInput name="confirm" autocomplete="off" spellcheck="false" [value]="confirmation()" (input)="confirmation.set(value($event))" />
    </label>

    @if (device().authRequired) {
      <div class="credentials">
        @if (device().gen === 1) {
          <label class="field">
            <span>{{ 'common.user' | t }}</span>
            <input name="username" autocomplete="off" [value]="username()" (input)="username.set(value($event))" />
          </label>
        }
        <label class="field">
          <span>{{ 'common.devicePassword' | t }}</span>
          <input name="password" type="password" autocomplete="off" [value]="password()" (input)="password.set(value($event))" />
        </label>
      </div>
    }

    @if (snapshotFailure(); as reason) {
      <div class="message error" role="alert">
        <p [innerHTML]="'reset.snapshotFailed' | t: { reason } | emphasis"></p>
        <label class="override">
          <input type="checkbox" name="override" [checked]="override()" (change)="override.set($any($event.target).checked)" />
          {{ 'reset.override' | t }}
        </label>
      </div>
    }
    @if (error(); as e) {
      <p class="message error" role="alert">{{ e }}</p>
    }

    <div class="buttons">
      <button type="button" class="secondary" [disabled]="busy()" (click)="close()">{{ 'common.cancel' | t }}</button>
      <button type="submit" class="danger" [disabled]="!canSubmit()">
        {{ (busy() ? 'reset.resetting' : 'reset.submit') | t }}
      </button>
    </div>
  </form>
</div>
