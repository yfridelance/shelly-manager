name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your situation, e.g. "I manage 40 devices in two houses and …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Mockups and examples are welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to help implement this.
